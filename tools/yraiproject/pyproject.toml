[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yraiproject"
version = "0.1.0"
description = "CLI to install and verify yrAiProjectTemplates-based projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
yraiproject = "yraiproject.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yraiproject*"]
