# Renders the meta-project Quarto book under docs/ on every push and PR.
# See docs/META-SPEC-v0.1.0.qmd (Continuous integration) for rationale.

name: Quarto docs

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        run: quarto render docs
