# On every push and pull request: test the tools and the templates, and render the documentation book.
# The same checks as on your computer: python3 tests/selftest.py and quarto render docs.

name: Test and render

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Test the tools and the templates (they make and render test projects)
        run: python3 tests/selftest.py

      - name: Render the documentation book
        run: quarto render docs
